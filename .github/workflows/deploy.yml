
name: My Brew Lab - Deploy ZIP

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website
        run: |
          mkdir -p _site
          cp -a assets _site/ 2>/dev/null || true
          cp -a icon-*.png _site/ 2>/dev/null || true
          cp -a manifest.json _site/ 2>/dev/null || true

          ZIP=$(find updates -maxdepth 1 -name '*.zip' | sort | tail -n 1)
          if [ -z "$ZIP" ]; then
            echo "No update ZIP found"
            exit 1
          fi

          unzip -q "$ZIP" -d _site
          test -f _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
