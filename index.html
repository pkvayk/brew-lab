async function uploadAll(){let n=0;for(const s of STORES)for(const x of await all(s)){await cPut(s,x);n++}toast(n+' items uploaded to cloud')}
async function startCloud(){
  setStatus('connecting');
  try{
    if(!hasClaude())throw new Error('nocap');
    const dbc=await claude.use('db'),u=await claude.use('user');
    if(!dbc||!u)throw new Error('noauth');
    col=dbc.collection('data/users/'+await u.id());
    if(unsub)unsub();let first=true;
    unsub=col.onSnapshot(async snap=>{
      cloudCount=snap.docs.filter(d=>parseId(d.id).pk===PROFILE.key).length;
      const sj=v=>JSON.stringify(v,(k,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.keys(x).sort().reduce((r,y)=>(r[y]=x[y],r),{}):x);
      const cache={};for(const s of STORES)cache[s]=new Map((await all(s)).map(x=>[String(x.id),sj(x)]));
      let changed=false;
      for(const ch of snap.docChanges()){
        const {pk,rest}=parseId(ch.doc.id);if(pk!==PROFILE.key)continue;
        const s=STORES.find(k=>rest.startsWith(k+'_'));if(!s)continue;
        if(ch.type==='removed'){const id=rest.slice(s.length+1);if(cache[s].has(id)){await _del(s,id);changed=true}continue}
        const o={...ch.doc.data()};delete o.__s;
        if(o.id&&cache[s].get(String(o.id))!==sj(o)){await _put(s,o);changed=true}}
      if(first){first=false;if(cloudCount===0){let n=0;for(const s of STORES)n+=(await all(s)).length;if(n&&confirm(t('The cloud is empty for '+PROFILE.name+'. Upload '+n+' local items now?','Cloud masih kosong untuk '+PROFILE.name+'. Unggah '+n+' data lokal sekarang?')))await uploadAll()}}
      setStatus('ok');if(changed)softRefresh()},()=>setStatus('error'));
    return true
  }catch(e){col=null;setStatus(e.message==='nocap'?'nocap':'off');return false}
}
async function setMode(m){

  g+=tx(L+pw/2,H-4,'Extraction yield (%)')+'<text transform="rotate(-90 10 '+(T+ph/2)+')" x="10" y="'+(T+ph/2)+'" font-size="10" fill="#7a7f9c" text-anchor="middle">TDS (%)</text>';
  g+=tx(L+6,T+13,'Strong · under','start',9)+tx(L+pw-6,T+13,'Strong · over','end',9)+tx(L+6,T+ph-6,'Weak · under','start',9)+tx(L+pw-6,T+ph-6,'Weak · over','end',9);
  pts.forEach(q=>{const on=q.id===hl;g+='<circle cx="'+X(q.ey).toFixed(1)+'" cy="'+Y(q.tds).toFixed(1)+'" r="'+(on?8:5)+'" fill="'+col(q)+'" fill-opacity="'+(hl&&!on?.45:.92)+'" stroke="#fff" stroke-width="2"/>'});
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Extraction map: TDS versus extraction yield">'+g+'</svg><div class="lp-leg"><span><i style="background:#18a058"></i>Rated 4+</span><span><i style="background:#3f5be8"></i>3–4</span><span><i style="background:#ff7a2f"></i>Below 3</span><span><i style="background:#7a7f9c"></i>Unrated</span></div>'}
const points=brs=>brs.filter(b=>+b.tds>0&&(+b.ey>0||eyOf(+b.tds,+b.yieldMl,+b.dose)>0)).map(b=>({id:b.id,kind:kindOf(b),ey:+b.ey||eyOf(+b.tds,+b.yieldMl,+b.dose),tds:+b.tds,rating:+b.overall||0}));
window.MBLStock={ageDays,eyOf,band,stockFor,controlChart,points,RANGE,kindOf};
if(typeof document==='undefined'||!document.querySelector)return;
const $$=s=>document.querySelector(s),WIP='wip-current';
async function beanInfo(name){const [bs,brs]=await Promise.all([all('beans'),all('brews')]);const b=bs.filter(x=>norm(x.name)===norm(name)).sort((a,b)=>String(b.purchaseDate||'').localeCompare(String(a.purchaseDate||'')))[0];return b?stockFor(b,brs):null}
window.MBLStock.beanInfo=beanInfo;
/* new beans remember when they were added (fallback for "days since") */
const _put=put;put=async(s,i)=>{if(s==='beans'&&!i.createdAt&&!(await all('beans')).some(x=>x.id===i.id))i.createdAt=new Date().toISOString();return _put(s,i)};
/* Beans page: stock + age on every card */
window.beanStatusHTML=b=>{const s=(window.__beanStock||{})[b.id];if(!s)return '';
  const age=s.ageDays!=null?'<div class="bean-meta"><span>Day '+s.ageDays+' since '+s.ageFrom+'</span></div>':'';
  if(!s.bag)return '<div class="bean-stock"><div class="bean-meta"><span>Add purchase weight to track stock</span></div>'+age+'</div>';
  const pct=Math.max(0,Math.min(100,s.pct));
  return '<div class="bean-stock"><div class="stock-bar"><i style="width:'+pct+'%"></i></div><div class="bean-meta"><span>'+(s.finished?'Finished':Math.round(s.remaining)+' g left')+'</span><span>'+(s.finished?'':'≈ '+s.brewsLeft+' brews')+'</span>'+(s.low?'<span class="stock-low">Low</span>':'')+'</div>'+age+'</div>'};
const _rbn=renderBeans;renderBeans=async function(){const [bs,brs]=await Promise.all([all('beans'),all('brews')]);window.__beanStock={};bs.forEach(b=>window.__beanStock[b.id]=stockFor(b,brs));return _rbn.apply(this,arguments)};
/* New Brew: bean hint, live extraction yield, decimal TDS, unfinished-brew banner + autosave */
function hookForm(){
  const f=$$('#brewForm');if(!f||f.dataset.stockHook)return;f.dataset.stockHook='1';
  const sel=$$('#f-bean'),dose=$$('#f-dose');
  if(sel&&!$$('#beanHint')){const h=document.createElement('small');h.id='beanHint';h.className='muted';sel.parentElement.appendChild(h);
    const upd=async()=>{h.textContent='';if(!sel.value)return;const s=await beanInfo(sel.value);if(!s)return;const p=[];
      if(s.ageDays!=null)p.push('Day '+s.ageDays+' since '+s.ageFrom);
      if(s.remaining!=null)p.push(s.finished?'bag finished':Math.round(s.remaining)+' g left (≈ '+s.brewsLeft+' brews)');
      if(s.remaining!=null&&!s.finished&&dose&&+dose.value>s.remaining)p.push('⚠ dose is more than what is left');h.textContent=p.join(' · ')};
    sel.addEventListener('change',upd);if(dose)dose.addEventListener('input',upd);upd()}
  const out=$$('#eyOut'),tds=$$('#f-tds'),yl=$$('#f-yieldMl'),me=$$('#f-method');
  const upEY=()=>{if(!out)return;const t=+String(tds&&tds.value||'').replace(',','.'),e=eyOf(t,+(yl&&yl.value),+(dose&&dose.value));out.textContent=e?e.toFixed(2)+' % · '+band(e,t,kindOf({method:me&&me.value})):'—'};
  [tds,yl,dose,me].forEach(el=>{if(el){el.addEventListener('input',upEY);el.addEventListener('change',upEY)}});upEY();
  if(tds)tds.addEventListener('input',()=>{const v=tds.value.replace(',','.').replace(/[^0-9.]/g,'').replace(/(\..*)\./g,'$1');if(v!==tds.value)tds.value=v});
  if(!editing){all('recipes').then(rs=>{const w=rs.find(r=>r.id===WIP);if(!w)return;if(Date.now()-stamp(w)>7*DAY){del('recipes',WIP);return}
    const bar=document.createElement('div');bar.className='draft-bar';
    bar.innerHTML='<span>Unfinished brew: <b>'+esc(w.title||w.bean||'Untitled')+'</b></span><button type="button" class="btn" data-wip="go">Continue</button><button type="button" class="btn" data-wip="drop">Discard</button>';
    f.prepend(bar);bar.onclick=async e=>{const k=e.target.dataset.wip;if(k==='go'){editing={...w,id:undefined,createdAt:undefined,_recipeId:w.id,_recipeCreatedAt:w.createdAt};navigate('new')}else if(k==='drop'){await del('recipes',WIP);bar.remove()}}})}
  let tm=0;const save=()=>{clearTimeout(tm);tm=setTimeout(async()=>{try{
    if(!$$('#brewForm')||(typeof savingBrew!=='undefined'&&savingBrew))return;if(editing&&editing._recipeId!==WIP)return;
    const b=collectBrewForm();if(!String(b.title||'').trim()&&!b.bean&&!(b.dose>0)&&!(b.water>0))return;
    await put('recipes',{...b,id:WIP,title:b.title||'Untitled draft',status:'draft',_wip:true,createdAt:(editing&&editing._recipeCreatedAt)||new Date().toISOString(),updatedAt:new Date().toISOString()})}catch(e){}},2000)};
  f.addEventListener('input',save);f.addEventListener('change',save)}
const _rf=renderForm;renderForm=async function(){const r=await _rf.apply(this,arguments);try{hookForm()}catch(e){}return r};
/* Brewing Detail: bean age, TDS / EY, extraction map, "rate now" */
const _sd=showDetail;
showDetail=function(b){_sd.apply(this,arguments);
  try{const c=$$('#content');let h='';
    if(!(Number(b.overall)>0)&&b.status!=='draft')h+='<section class="panel draft-bar" style="margin:12px 0"><span>This brew has no rating yet.</span><button type="button" class="btn primary" id="rateNow">Rate now</button></section>';
    if(b.beanAgeDays!=null)h+='<p class="muted">Bean age on brew day: Day '+b.beanAgeDays+' since '+esc(b.beanAgeFrom||'purchase')+'</p>';
    const t=+b.tds,e=+b.ey||eyOf(t,+b.yieldMl,+b.dose);
    if(t>0){const k=kindOf(b);h+='<section class="panel"><h2>Strength &amp; Extraction</h2><div class="brew"><span>TDS</span><strong>'+t.toFixed(2)+' %</strong></div>'+(e?'<div class="brew"><span>Extraction yield</span><strong>'+e.toFixed(2)+' %</strong></div><p class="muted">'+band(e,t,k)+'</p>'+'<div id="detailChart"></div>':'<p class="muted">Add a final yield to calculate extraction yield.</p>')+'</section>'}
    c.insertAdjacentHTML('beforeend',h);
    if(t>0&&e)all('brews').then(brs=>{const d=$$('#detailChart'),k=kindOf(b);if(d)d.innerHTML=controlChart(points(brs).filter(q=>q.kind===k),k,b.id)});
    const rn=$$('#rateNow');if(rn)rn.onclick=()=>{editing={...b};navigate('new');setTimeout(()=>{const s=[...document.querySelectorAll('details.panel summary')].find(x=>/taste/i.test(x.textContent));if(s){s.parentElement.open=true;s.scrollIntoView({behavior:'smooth'})}},500)}}catch(e){}};
/* Dashboard: low stock + extraction maps */
const _rd=renderDashboard;
renderDashboard=async function(){await _rd.apply(this,arguments);
  try{const [brs,bns]=await Promise.all([all('brews'),all('beans')]);window.__allBrews=brs;let h='';
    const low=bns.map(b=>({b,s:stockFor(b,brs)})).filter(x=>x.s.low||x.s.finished);
    if(low.length)h+='<section class="panel"><h2>Bean stock</h2>'+low.map(x=>'<p style="margin:6px 0">'+esc(x.b.name)+' — '+(x.s.finished?'finished':Math.round(x.s.remaining)+' g left (≈ '+x.s.brewsLeft+' brews)')+'</p>').join('')+'</section>';
    const pts=points(brs);
    ['filter','espresso'].forEach(k=>{const p=pts.filter(q=>q.kind===k);if(p.length)h+='<section class="panel"><h2>Extraction Map · '+(k==='filter'?'Filter':'Espresso')+'</h2>'+controlChart(p,k)+'<p class="muted">'+p.length+' brew(s) with TDS. The shaded zone is a common target range (EY 18–22 %) — a guide, not a rule.</p></section>'});
    if(h)$$('#content').insertAdjacentHTML('beforeend',h)}catch(e){}};
})();

</script></body></html>
