'use strict';const DBNAME='my-brew-lab-v1';let tasteValues={};let db,editing=null,pours=[],page='dashboard';const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();const today=()=>new Date().toISOString().slice(0,10);const num=x=>Number(x)||0;const fmt=x=>Number.isFinite(x)?x.toFixed(1):'—';const toast=m=>{$('#toast').textContent=m;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),3200)};
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DBNAME,4);r.onupgradeneeded=()=>{const database=r.result;for(const store of ['brews','beans','equipment','recipes']){if(!database.objectStoreNames.contains(store))database.createObjectStore(store,{keyPath:'id'});}};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('Database sedang digunakan di tab lain. Tutup tab lain dan muat ulang.'));})}function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}function all(store){return new Promise((res,rej)=>{let r=tx(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function put(store,item){return new Promise((res,rej)=>{let r=tx(store,'readwrite').put(item);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}function del(store,id){return new Promise((res,rej)=>{let r=tx(store,'readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}function clear(store){return new Promise((res,rej)=>{let r=tx(store,'readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}

function navigate(p){page=p;document.querySelector('#calendarPopup')?.classList.add('hidden');document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===p||(p==='history'&&n.dataset.page==='recipes')));$('#pageTitle').textContent=({dashboard:'Dashboard',new:editing?'Edit Brewing':'New Brewing Session',history:'Brew History',recipes:'Recipe Library',beans:'Coffee Beans',equipment:'Equipment Library',compare:'Compare Brews',backup:'Backup & Restore',settings:'Settings'})[p];Promise.resolve().then(()=>({dashboard:renderDashboard,new:renderForm,history:renderHistory,recipes:renderRecipes,beans:renderBeans,equipment:renderEquipment,compare:renderCompare,backup:renderBackup,settings:renderSettings})[p]()).catch(err=>{console.error(err);if(page===p)$('#content').innerHTML='<section class="panel">Gagal memuat halaman: '+esc(err.message)+'</section>'});window.scrollTo(0,0)}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{if(b.dataset.page==='new')editing=null;navigate(b.dataset.page)});document.querySelectorAll('.subitem[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));document.querySelectorAll('[data-eq-tab]').forEach(b=>b.onclick=()=>{equipmentTab=b.dataset.eqTab;navigate('equipment')});$('#collapseSide').onclick=()=>{document.querySelector('#appShell').classList.toggle('collapsed');localStorage.setItem('mbl-sidebar-collapsed',document.querySelector('#appShell').classList.contains('collapsed')?'1':'0')};if(localStorage.getItem('mbl-sidebar-collapsed')==='1')$('#appShell').classList.add('collapsed');

async function renderDashboard(){

function field(label,name,value='',type='text',extra=''){return `<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}function selectField(label,name,options,value){return `<div class="field"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${options.map(o=>`<option value="${esc(o)}" ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}
async function renderForm(){let b=editing||{},beans=await all('beans'),equipment=await all('equipment');pours=(b.pours||[{at:'0:00',grams:50},{at:'0:30',grams:100},{at:'1:00',grams:150},{at:'1:30',grams:200}]).map(x=>({...x}));tasteValues=Object.fromEntries(['sweetness','acidity','bitterness','body','aroma','aftertaste','overall'].map(k=>[k,Number(b[k]??3)]));$('#content').innerHTML=`<form id="brewForm"><details class="panel" open><summary>01 · Coffee & Brewing Setup</summary><div class="formgrid">${field('Tanggal','date',b.date||today(),'date','required')}${field('Judul / Versi','title',b.title||'Brew #1','text','required')}${selectField('Coffee Bean','bean',[...new Set([b.bean,...beans.map(x=>x.name)].filter(Boolean))],b.bean||beans[0]?.name)}${selectField('Method','method',['Ice pour-over','Hot pour-over','Immersion','Other'],b.method||'Ice pour-over')}</div></details><details class="panel" open><summary>02 · Equipment Setup</summary><p class="hint">Pilih alat terlebih dahulu; pengaturan lanjut hanya muncul jika diperlukan.</p><div class="formgrid">${equipmentSelect('Grinder','grinder',equipment,b.grinder||'Timemore Chestnut S5 Pro')}<div class="field" id="grindConfig"><label id="grindLabel" for="f-grind">Grind setting</label><div id="grindSliderWrap" class="hidden"><input type="range" id="grindSlider" min="0" max="9" step="0.1" value="6.5" style="width:100%"><div class="row"><small id="grindMinLabel">0</small><strong id="grindOutput">6.5</strong><small id="grindMaxLabel">9</small></div></div><input name="grind" id="f-grind" value="${esc(b.grind??'6.5')}" placeholder="Setting"></div>${equipmentSelect('Dripper','dripper',equipment,b.dripper||'Timemore B75')}<div id="filterContainer">${equipmentSelect('Paper Filter','filter',equipment,b.filter)}</div>${equipmentSelect('Kettle','kettle',equipment,b.kettle)}${equipmentSelect('Server','server',equipment,b.server)}</div></details><details class="panel" open><summary>03 · Brewing Parameters</summary><div class="formgrid function initGlobalWidgets(){const paint=()=>{let d=new Date();$('#topDate').textContent=d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});$('#topClock').textContent=d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',hour12:false})};paint();setInterval(paint,15000);$('#dateClock').onclick=async()=>{$('#calendarPopup').classList.toggle('hidden');if(!$('#calendarPopup').classList.contains('hidden')){calCursor=new Date();await renderCalendar()}};$('#calPrev').onclick=async()=>{calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()-1,1);await renderCalendar()};$('#calNext').onclick=async()=>{calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()+1,1);await renderCalendar()};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#calendarPopup').classList.add('hidden')});loadWeather();setInterval(loadWeather,30*60*1000)}
async function renderCalendar(){if(calBusy)return;calBusy=true;try{const y=calCursor.getFullYear(),m=calCursor.getMonth(),bs=await all('brews'),counts={};for(const b of bs){if(/^\d{4}-\d{2}-\d{2}$/.test(b.date||''))counts[b.date]=(counts[b.date]||0)+1}$('#calMonth').textContent=calCursor.toLocaleDateString('id-ID',{month:'long',year:'numeric'});const first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();let html=['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(x=>`<span class="cal-weekday">${x}</span>`).join('');for(let i=0;i<first;i++)html+='<span></span>';for(let i=1;i<=days;i++){let date=localDateString(new Date(y,m,i)),count=counts[date]||0;html+=`<button class="cal-day ${date===localDateString(new Date())?'today':''} ${count?'has-brews':''}" data-cal-date="${date}"><span>${i}</span><small>${count||'·'}</small></button>`}$('#calendarGrid').innerHTML=html;document.querySelectorAll('[data-cal-date]').forEach(b=>b.onclick=()=>{historyDateFilter=b.dataset.calDate;navigate('history')})}finally{calBusy=false}}
async function loadWeather(){const city=localStorage.getItem('mbl-weather-city')||'Jakarta';$('#weatherCity').textContent=city;try{const geo=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(city)+'&count=1&language=id&format=json');if(!geo.ok)throw Error('geocoding');const loc=(await geo.json()).results?.[0];if(!loc)throw Error('Kota tidak ditemukan');const res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current=temperature_2m,weather_code&timezone=auto`);if(!res.ok)throw Error('weather');const c=(await res.json()).current;$('#weatherTemp').textContent=Math.round(c.temperature_2m)+'°C';$('#weatherIcon').textContent=c.weather_code===0?'☀️':c.weather_code<=3?'⛅':c.weather_code<=48?'🌫️':c.weather_code<=67?'🌧️':'☁️';$('#weatherCity').textContent=loc.name}catch(e){$('#weatherTemp').textContent='—°';$('#weatherIcon').textContent='☁';$('#weatherCity').textContent=city+' · offline'}}

initGlobalWidgets();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});init().catch(err=>{$('#content').innerHTML='<div class="panel">Gagal membuka database. Pastikan Safari tidak berada di Private Browsing dan penyimpanan diizinkan. '+esc(err.message)+'</div>'});
</script></body></html>
