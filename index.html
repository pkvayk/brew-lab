const tasteKeys=['sweetness','acidity','bitterness','body','aroma','aftertaste'];
function tasteComplete(){return tasteKeys.every(k=>Number(tasteValues[k])>=1)}
function calculatedOverall(){return tasteComplete()?tasteKeys.reduce((n,k)=>n+Number(tasteValues[k]),0)/tasteKeys.length:0}
function updateTasteOverall(){
 const complete=tasteComplete(),output=$('#tasteOverall'),hint=$('#tasteHint');
 if(output)output.textContent=complete?calculatedOverall().toFixed(1)+' / 5':'— / 5';
 if(hint)hint.textContent=complete?'All six taste parameters evaluated':'Complete all six ratings to calculate Overall';
}
function drawRadar(){let keys=['sweetness','acidity','bitterness','body','aroma','aftertaste'],labels=['Sweet','Acid','Bitter','Body','Aroma','Finish'];let pt=(i,r)=>{let a=-Math.PI/2+i*Math.PI/3;return [160+Math.cos(a)*r,155+Math.sin(a)*r]};let polygon=r=>keys.map((_,i)=>pt(i,r).join(',')).join(' ');let svg=[1,2,3,4,5].map(n=>`<polygon points="${polygon(n*20)}" fill="none" stroke="#d8c8bc" stroke-width="1"/>`).join('');svg+=keys.map((k,i)=>{let [x,y]=pt(i,118),[x2,y2]=pt(i,100);return `<line x1="160" y1="155" x2="${x2}" y2="${y2}" stroke="#dfd0c4"/><text x="${x}" y="${y}" text-anchor="middle" font-size="11" fill="#5c4536">${labels[i]}</text>`}).join('');svg+=`<polygon points="${keys.map((k,i)=>pt(i,20*tasteValues[k]).join(',')).join(' ')}" fill="#a87a58" fill-opacity=".25" stroke="#8d6346" stroke-width="2.5"/>`;$('#tasteRadar').innerHTML=svg}
function updateRatio(){let d=num($('#f-dose').value),w=num($('#f-water').value),i=num($('#f-ice').value),iced=/ice/i.test($('#f-method').value);let iceField=$('#f-ice').closest('.field');iceField.classList.toggle('hidden',!iced);document.querySelectorAll('.brew-method-btn').forEach(btn=>{let active=/ice/i.test(btn.dataset.method)===iced;btn.classList.toggle('selected',active);btn.setAttribute('aria-pressed',String(active))});let one=x=>Number(x).toFixed(1).replace('.',',');$('#ratio').innerHTML=d>0?`<div class="ratio-grid"><div class="ratio-tile"><small>${iced?'Sebelum es':'Brew Ratio'}</small><strong>1:${one(w/d)}</strong></div>${iced?`<div class="ratio-tile"><small>Setelah es (nominal)</small><strong>1:${one((w+i)/d)}</strong></div>`:''}</div>`:'Masukkan dosis kopi untuk menghitung rasio.'}function drawPours(){$('#pours').innerHTML=pours.map((p,i)=>`<div class="pour"><input class="search" aria-label="Waktu pour ${i+1}" placeholder="mm:ss" value="${esc(p.at)}" data-pour="${i}" data-key="at"><input class="search" aria-label="Berat kumulatif pour ${i+1}" type="number" min="0" step="1" placeholder="Total gram" value="${esc(p.grams)}" data-pour="${i}" data-key="grams"><span class="muted" style="align-self:center">Pour ${i+1}</span><button class="btn danger" type="button" data-remove="${i}" aria-label="Hapus pour ${i+1}">×</button></div>`).join('');document.querySelectorAll('[data-pour]').forEach(e=>e.oninput=()=>pours[+e.dataset.pour][e.dataset.key]=e.value);document.querySelectorAll('[data-remove]').forEach(e=>e.onclick=()=>{pours.splice(+e.dataset.remove,1);drawPours()})}
function recipeSignature(r){
 const clean=v=>String(v??'').trim().toLowerCase();
 const number=v=>Number(v||0).toFixed(2);
 return JSON.stringify([clean(r.bean),clean(r.method),number(r.dose),number(r.water),number(r.ice),
 clean(r.grinder),clean(r.grind),clean(r.dripper),clean(r.filter),
 JSON.stringify((r.pours||[]).map(p=>[clean(p.at),number(p.grams)]))]);
}
async function storeRecipeSafely(b, sourceId=''){
 const recipes=await all('recipes');
 const match=recipes.find(r=>r.id===sourceId)||recipes.find(r=>recipeSignature(r)===recipeSignature(b));
 if(match){
   if(match.id===sourceId){
     const update=confirm('Recipe ini sudah ada. Update resep yang sudah tersimpan?\nCancel = gunakan resep lama tanpa membuat duplikat.');
     if(update)await put('recipes',{...match,...b,id:match.id,createdAt:match.createdAt,updatedAt:new Date().toISOString()});
   }else toast('Resep identik sudah ada di Recipe Library; tidak membuat duplikat.');

const enToId=new Map(pairs),idToEn=new Map(pairs.map(([en,id])=>[id,en]));
const skip='input,textarea,option,script,style,[contenteditable],.brew-main strong,.brew-main small,.bean-card,.bean-name,.recipe-name,.favorite-brew-name,.brew-card-title';
const langKey='mbl-language';
let lang=localStorage.getItem(langKey)==='id'?'id':'en',running=false;
let obs=null;
// Track the original source string so toggling language is reversible on every render.
const originals=new WeakMap();
const extraIdToEn=new Map([
 ['Pilih alat terlebih dahulu; pengaturan lanjut hanya muncul jika diperlukan.','Choose your equipment first; advanced settings appear only when needed.'],
 ['Berat air kumulatif di setiap tahap. Bisa diedit tanpa scale.','Cumulative water weight at each step. Editable without a scale.'],
 ['Data disimpan secara lokal di browser. Simpan backup JSON secara berkala sebelum pembaruan.','Data is stored locally in your browser. Back up your JSON regularly before updating.']
]);
function translate(){if(running)return;running=true;if(obs)obs.disconnect();try{
 const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;
 while((n=walker.nextNode())){
  const parent=n.parentElement;if(!parent||parent.closest(skip))continue;
  const raw=n.nodeValue,trim=raw.trim();if(!trim)continue;
  let original=originals.get(n);
  if(!original||(![original,enToId.get(original),idToEn.get(original),extraIdToEn.get(original)].includes(trim))){original=trim;originals.set(n,original)}
  const en=extraIdToEn.get(original)||idToEn.get(original)||original;
  const target=lang==='id'?(enToId.get(en)||original):en;
  if(trim!==target)n.nodeValue=raw.replace(trim,target);
 }
 document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
 document.getElementById('currentFlag').textContent=lang==='id'?'🇮🇩':'🇺🇸';
 document.getElementById('currentLanguage').textContent=lang==='id'?'Bahasa Indonesia':'English (US)';
 document.documentElement.lang=lang;
}finally{running=false;if(obs)obs.observe(document.body,{childList:true,subtree:true,characterData:true})}}
function setLang(l){if(!['en','id'].includes(l))return;lang=l;localStorage.setItem(langKey,l);translate();document.getElementById('languageChoices').hidden=true;document.getElementById('languageToggle').setAttribute('aria-expanded','false')}
const toggle=document.getElementById('languageToggle'),choices=document.getElementById('languageChoices');
toggle.addEventListener('click',()=>{choices.hidden=!choices.hidden;toggle.setAttribute('aria-expanded',String(!choices.hidden))});
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
document.addEventListener('click',e=>{if(!document.getElementById('sidebarLanguage').contains(e.target)){choices.hidden=true;toggle.setAttribute('aria-expanded','false')}});
obs=new MutationObserver(()=>{if(!running)translate()});translate();
})();
