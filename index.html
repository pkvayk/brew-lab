'use strict';const DBNAME='my-brew-lab-v1';let tasteValues={};let db,editing=null,pours=[],page='dashboard';const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();const today=()=>new Date().toISOString().slice(0,10);const num=x=>Number(x)||0;const fmt=x=>Number.isFinite(x)?x.toFixed(1):'—';const toast=m=>{$('#toast').textContent=m;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),3200)};
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DBNAME,4);r.onupgradeneeded=()=>{const database=r.result;for(const store of ['brews','beans','equipment','recipes']){if(!database.objectStoreNames.contains(store))database.createObjectStore(store,{keyPath:'id'});}};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('Database sedang digunakan di tab lain. Tutup tab lain dan muat ulang.'));})}function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}function all(store){return new Promise((res,rej)=>{let r=tx(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function put(store,item){return new Promise((res,rej)=>{let r=tx(store,'readwrite').put(item);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}function del(store,id){return new Promise((res,rej)=>{let r=tx(store,'readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}function clear(store){return new Promise((res,rej)=>{let r=tx(store,'readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
const seedBeans=[{name:'Ijen Blue Mountain',roaster:'Sidikalang Jaya',origin:'Ijen',process:'',roast:''},{name:'Puntang Wine',roaster:'Toko Kopi Haji Wawa',origin:'Puntang',process:'Wine',roast:''},{name:'Aceh Gayo',roaster:'Sidikalang Jaya',origin:'Aceh Gayo',process:'',roast:''},{name:'Flores Bajawa',roaster:'Sidikalang Jaya',origin:'Flores Bajawa',process:'',roast:''},{name:'Ijen Natural',roaster:'Toko Kopi Haji Wawa',origin:'Ijen',process:'Natural',roast:''},{name:'Bali Arabika',roaster:'Excelso',origin:'Bali',process:'',roast:''}];

async function init(){db=await openDB();if(!(await all('beans')).length){for(let b of seedBeans)await put('beans',{id:uid(),...b})}if(!(await all('brews')).length&&!localStorage.getItem('mbl-initialized')){for(let b of seedBrews)await put('brews',{id:uid(),...b,createdAt:new Date().toISOString()})}if(!(await all('equipment')).length&&!localStorage.getItem('mbl-equipment-initialized')){for(let x of seedEquipment)await put('equipment',{id:uid(),...x})}localStorage.setItem('mbl-equipment-initialized','1');localStorage.setItem('mbl-initialized','1');navigate('dashboard')}
function navigate(p){page=p;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===p));$('#pageTitle').textContent=({dashboard:'Dashboard',new:editing?'Edit Brewing':'New Brewing Session',history:'Brew History',recipes:'Recipe Library',beans:'Coffee Beans',equipment:'Equipment Library',compare:'Compare Brews',backup:'Backup & Restore'})[p];Promise.resolve().then(()=>({dashboard:renderDashboard,new:renderForm,history:renderHistory,recipes:renderRecipes,beans:renderBeans,equipment:renderEquipment,compare:renderCompare,backup:renderBackup})[p]()).catch(err=>{console.error(err);if(page===p)$('#content').innerHTML='<section class="panel">Gagal memuat halaman: '+esc(err.message)+'</section>'});window.scrollTo(0,0)}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{if(b.dataset.page==='new')editing=null;navigate(b.dataset.page)});$('#quickNew').onclick=()=>{editing=null;navigate('new')};
function brewLine(b){return `<div class="brew"><div><strong>${esc(b.bean)} <span class="pill">${esc(b.title||'Brew')}</span></strong><small>${esc(b.date)} · ${esc(b.dripper)} · ${esc(b.dose)}g · ${esc(b.temp)}°C</small><small>${esc((b.notes||'').slice(0,135))}</small></div><div class="list-actions"><button class="btn" data-action="view" data-id="${esc(b.id)}">Detail</button><button class="btn" data-action="duplicate" data-id="${esc(b.id)}">Duplikat</button></div></div>`}

let clockInterval=null;function startDashboardWidgets(){if(clockInterval)clearInterval(clockInterval);const paint=()=>{if(!$('#liveClock')){clearInterval(clockInterval);clockInterval=null;return}let now=new Date();$('#liveClock').textContent=now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});$('#todayDate').textContent=now.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})};paint();clockInterval=setInterval(paint,1000);$('#loadWeather').onclick=()=>{let status=$('#weatherStatus');status.textContent='Mencari lokasi…';if(!navigator.geolocation){status.textContent='Geolocation tidak didukung';return}navigator.geolocation.getCurrentPosition(async pos=>{try{let {latitude,longitude}=pos.coords;let u=`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code&timezone=auto`;let r=await fetch(u);if(!r.ok)throw Error('Layanan cuaca tidak tersedia');let d=await r.json(),c=d.current,code=c.weather_code;let icon=code===0?'☀️':code<=3?'⛅':code<=48?'🌫️':code<=67?'🌧️':code<=77?'❄️':'⛈️';if($('#weatherStatus'))$('#weatherStatus').textContent=`${icon} ${Math.round(c.temperature_2m)}°C · Cuaca lokal`}catch(e){if($('#weatherStatus'))$('#weatherStatus').textContent='Gagal mengambil cuaca. Periksa internet.'}},()=>{if($('#weatherStatus'))$('#weatherStatus').textContent='Izin lokasi tidak diberikan'},{timeout:12000,maximumAge:600000})}}
async function renderDashboard(){let bs=(await all('brews')).sort((a,b)=>b.date.localeCompare(a.date)),beans=await all('beans');let avg=bs.length?fmt(bs.reduce((s,b)=>s+num(b.overall),0)/bs.length):'—';$('#content').innerHTML=`<section class="panel" style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap"><div><div class="muted" id="todayDate"></div><div style="font-size:29px;font-weight:800;font-variant-numeric:tabular-nums" id="liveClock"></div></div><div><span id="weatherStatus" class="muted">Cuaca belum diaktifkan</span> <button class="btn" id="loadWeather">☀ Lihat cuaca lokal</button></div></section><div class="cards"><div class="card"><div class="muted">Total Brewing</div><div class="metric">${bs.length}</div><small class="muted">Sesi tercatat</small></div><div class="card"><div class="muted">Coffee Beans</div><div class="metric">${beans.length}</div><small class="muted">Varian tersimpan</small></div><div class="card"><div class="muted">Average Rating</div><div class="metric">${avg}<span style="font-size:16px"> / 5</span></div><small class="muted">Dari seluruh sesi</small></div></div><section class="panel"><div class="row"><h2>Recent Brews</h2><button class="btn" id="goHistory">Lihat semua →</button></div>${bs.slice(0,6).map(brewLine).join('')||'<div class="empty">Belum ada brew. Tambahkan yang pertama!</div>'}</section><section class="panel"><h2>Tips pencatatan</h2><p class="muted">Duplikat resep sebelumnya, ubah satu variabel saja (misalnya grind atau suhu), lalu bandingkan hasilnya. Nilai rasa 1–5 mempermudah analisis.</p></section>`;$('#goHistory').onclick=()=>navigate('history');bindActions();startDashboardWidgets()}
function field(label,name,value='',type='text',extra=''){return `<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}function selectField(label,name,options,value){return `<div class="field"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${options.map(o=>`<option value="${esc(o)}" ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}
async function renderForm(){let b=editing||{},beans=await all('beans'),equipment=await all('equipment');pours=(b.pours||[{at:'0:00',grams:50},{at:'0:30',grams:100},{at:'1:00',grams:150},{at:'1:30',grams:200}]).map(x=>({...x}));tasteValues=Object.fromEntries(['sweetness','acidity','bitterness','body','aroma','aftertaste','overall'].map(k=>[k,Number(b[k]??3)]));$('#content').innerHTML=`<form id="brewForm"><details class="panel" open><summary>01 · Coffee & Brewing Setup</summary><div class="formgrid">${field('Tanggal','date',b.date||today(),'date','required')}${field('Judul / Versi','title',b.title||'Brew #1','text','required')}${selectField('Coffee Bean','bean',[...new Set([b.bean,...beans.map(x=>x.name)].filter(Boolean))],b.bean||beans[0]?.name)}${selectField('Method','method',['Ice pour-over','Hot pour-over','Immersion','Other'],b.method||'Ice pour-over')}</div></details><details class="panel" open><summary>02 · Equipment Setup</summary><p class="hint">Pilih alat terlebih dahulu; pengaturan lanjut hanya muncul jika diperlukan.</p><div class="formgrid">${equipmentSelect('Grinder','grinder',equipment,b.grinder||'Timemore Chestnut S5 Pro')}<div class="field" id="grindConfig"><label id="grindLabel" for="f-grind">Grind setting</label><div id="grindSliderWrap" class="hidden"><input type="range" id="grindSlider" min="0" max="9" step="0.1" value="6.5" style="width:100%"><div class="row"><small id="grindMinLabel">0</small><strong id="grindOutput">6.5</strong><small id="grindMaxLabel">9</small></div></div><input name="grind" id="f-grind" value="${esc(b.grind??'6.5')}" placeholder="Setting"></div>${equipmentSelect('Dripper','dripper',equipment,b.dripper||'Timemore B75')}<div id="filterContainer">${equipmentSelect('Paper Filter','filter',equipment,b.filter)}</div>${equipmentSelect('Kettle','kettle',equipment,b.kettle)}${equipmentSelect('Server','server',equipment,b.server)}</div></details><details class="panel" open><summary>03 · Brewing Parameters</summary><div class="formgrid">${field('Dose (g)','dose',b.dose??18,'number','min="0.1" step="0.1" required')}${field('Brew Water (g)','water',b.water??200,'number','min="0" step="1" required')}${field('Ice After Brew (g)','ice',b.ice??60,'number','min="0" step="1"')}${field('Water Temp (°C)','temp',b.temp??90,'number','min="0" max="100" step="0.5"')}${field('Total Time (mm:ss)','time',b.time||'2:15')}</div><div id="ratio" class="muted" style="margin-top:14px"></div></details><details class="panel" open><summary>04 · Pouring Schedule</summary><div class="row"><p class="muted">Berat air kumulatif di setiap tahap. Bisa diedit tanpa scale.</p><button class="btn" type="button" id="addPour">＋ Add Pour</button></div><div id="pours"></div></details><details class="panel" open><summary>05 · Taste Radar & Evaluation</summary><div class="tastegrid"><svg class="tastechart" id="tasteRadar" viewBox="0 0 320 320" role="img" aria-label="Grafik radar profil rasa"></svg><div id="tasteSliders">${['sweetness','acidity','bitterness','body','aroma','aftertaste','overall'].map(k=>`<div class="taste-range"><label for="f-${k}"><span>${k[0].toUpperCase()+k.slice(1)}</span><output id="out-${k}">${tasteValues[k].toFixed(1)} / 5</output></label><input id="f-${k}" name="${k}" type="range" min="0" max="5" step="0.5" value="${tasteValues[k]}"></div>`).join('')}</div></div><div class="field"><label for="f-notes">Tasting Notes & Observations</label><textarea id="f-notes" name="notes" placeholder="Winey, berry, grape, bitterness, aftertaste...">${esc(b.notes||'')}</textarea></div></details><div class="row" style="margin-top:18px;gap:8px;flex-wrap:wrap"><button class="btn primary" type="submit">💾 Simpan Brewing</button><button class="btn" type="button" id="saveRecipe">☆ ${b._recipeId?"Save Recipe Changes":"Save as Recipe"}</button><button class="btn" type="button" id="cancelEdit">Batal</button></div></form>`;$('#addPour').onclick=()=>{pours.push({at:'',grams:''});drawPours()};$('#cancelEdit').onclick=()=>{editing=null;navigate('history')};$('#brewForm').onsubmit=saveBrew;['dose','water','ice'].forEach(n=>$('#f-'+n).addEventListener('input',updateRatio));for(let k of Object.keys(tasteValues))$('#f-'+k).oninput=e=>{tasteValues[k]=Number(e.target.value);$('#out-'+k).textContent=tasteValues[k].toFixed(1)+' / 5';drawRadar()};drawRadar();drawPours();updateRatio();function updateEquipment(){let grinder=$('#f-grinder').value,dripper=$('#f-dripper').value;let item=equipment.find(x=>x.category==='grinder'&&x.name===grinder);let clicks=/comandante|c40|click/i.test(grinder+' '+(item?.grindUnit||''));let numeric=/timemore.*s5/i.test(grinder)||item?.grindUnit==='numeric';let useSlider=!!grinder&&(clicks||numeric);$('#grindConfig').classList.toggle('hidden',!grinder);$('#grindSliderWrap').classList.toggle('hidden',!useSlider);$('#grindLabel').textContent=clicks?'Grind size (clicks)':numeric?'Grind size (0–9)':'Grind setting';let inp=$('#f-grind'),slider=$('#grindSlider');inp.type=useSlider?'number':'text';if(useSlider){let min=Number(item?.grindMin||0),max=Number(item?.grindMax||(clicks?100:9)),step=Number(item?.grindStep||(clicks?1:0.1));if(!(max>min))max=clicks?100:9;if(!(step>0))step=clicks?1:0.1;inp.min=slider.min=min;inp.max=slider.max=max;inp.step=slider.step=step;let current=Number(inp.value);if(!Number.isFinite(current))current=min;current=Math.max(min,Math.min(max,current));slider.value=current;inp.value=current;$('#grindOutput').textContent=current;$('#grindMinLabel').textContent=min;$('#grindMaxLabel').textContent=max;slider.oninput=()=>{inp.value=slider.value;$('#grindOutput').textContent=slider.value};inp.oninput=()=>{let v=Number(inp.value);if(Number.isFinite(v)){slider.value=Math.max(min,Math.min(max,v));$('#grindOutput').textContent=inp.value}}}else{inp.removeAttribute('min');inp.removeAttribute('max');inp.removeAttribute('step');slider.oninput=null;inp.oninput=null}$('#filterContainer').classList.toggle('hidden',!dripper);let sel=$('#f-filter');if(dripper){let previous=sel.value||b.filter||'';let options=equipment.filter(x=>x.category==='filter');let compatible=options.filter(x=>!x.compatibleDrippers||x.compatibleDrippers.split(',').map(t=>t.trim().toLowerCase()).includes(dripper.toLowerCase()));sel.innerHTML='<option value="">— Pilih Paper Filter —</option>'+compatible.map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join('');sel.value=compatible.some(x=>x.name===previous)?previous:''}}$('#f-grinder').onchange=updateEquipment;$('#f-dripper').onchange=updateEquipment;updateEquipment();$('#saveRecipe').onclick=async()=>{let f=new FormData($('#brewForm'));let title=prompt('Nama resep yang ingin disimpan:',String(f.get('title')||'My Recipe'));if(!title)return;let data=Object.fromEntries(f);for(let k of Object.keys(tasteValues))data[k]=tasteValues[k];await put('recipes',{...data,id:editing?._recipeId||uid(),title,createdAt:editing?._recipeCreatedAt||new Date().toISOString(),updatedAt:new Date().toISOString(),pours:pours.map(p=>({...p}))});toast(editing?._recipeId?'Perubahan resep disimpan':'Resep baru tersimpan');if(editing?._recipeId){editing=null;navigate('recipes')}}}
function drawRadar(){let keys=['sweetness','acidity','bitterness','body','aroma','aftertaste'],labels=['Sweet','Acid','Bitter','Body','Aroma','Finish'];let pt=(i,r)=>{let a=-Math.PI/2+i*Math.PI/3;return [160+Math.cos(a)*r,155+Math.sin(a)*r]};let polygon=r=>keys.map((_,i)=>pt(i,r).join(',')).join(' ');let svg=[1,2,3,4,5].map(n=>`<polygon points="${polygon(n*20)}" fill="none" stroke="#d8c8bc" stroke-width="1"/>`).join('');svg+=keys.map((k,i)=>{let [x,y]=pt(i,118),[x2,y2]=pt(i,100);return `<line x1="160" y1="155" x2="${x2}" y2="${y2}" stroke="#dfd0c4"/><text x="${x}" y="${y}" text-anchor="middle" font-size="11" fill="#5c4536">${labels[i]}</text>`}).join('');svg+=`<polygon points="${keys.map((k,i)=>pt(i,20*tasteValues[k]).join(',')).join(' ')}" fill="#a87a58" fill-opacity=".25" stroke="#8d6346" stroke-width="2.5"/>`;$('#tasteRadar').innerHTML=svg}
function updateRatio(){let d=num($('#f-dose').value),w=num($('#f-water').value),i=num($('#f-ice').value);$('#ratio').textContent=`Rasio air seduh: ${d?'1 : '+fmt(w/d):'—'} · Total air + es: ${w+i}g (sebelum retensi dan dilusi aktual)`}function drawPours(){$('#pours').innerHTML=pours.map((p,i)=>`<div class="pour"><input class="search" aria-label="Waktu pour ${i+1}" placeholder="mm:ss" value="${esc(p.at)}" data-pour="${i}" data-key="at"><input class="search" aria-label="Berat kumulatif pour ${i+1}" type="number" min="0" step="1" placeholder="Total gram" value="${esc(p.grams)}" data-pour="${i}" data-key="grams"><span class="muted" style="align-self:center">Pour ${i+1}</span><button class="btn danger" type="button" data-remove="${i}" aria-label="Hapus pour ${i+1}">×</button></div>`).join('');document.querySelectorAll('[data-pour]').forEach(e=>e.oninput=()=>pours[+e.dataset.pour][e.dataset.key]=e.value);document.querySelectorAll('[data-remove]').forEach(e=>e.onclick=()=>{pours.splice(+e.dataset.remove,1);drawPours()})}
async function saveBrew(e){e.preventDefault();let f=new FormData(e.target),b={...(editing||{}),id:editing?.id||uid(),createdAt:editing?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};for(let k of ['date','title','bean','server','dripper','filter','grinder','kettle','grind','time','method','notes'])b[k]=String(f.get(k)||'');for(let k of ['dose','water','ice','temp','sweetness','acidity','bitterness','body','aroma','aftertaste','overall'])b[k]=num(f.get(k));b.pours=pours.map(x=>({at:String(x.at),grams:num(x.grams)})).filter(x=>x.at||x.grams);if(!b.bean||b.dose<=0){toast('Isi coffee bean dan dose yang valid');return}await put('brews',b);editing=null;toast('Brewing berhasil disimpan');navigate('history')}
async function renderHistory(){let bs=(await all('brews')).sort((a,b)=>b.date.localeCompare(a.date));$('#content').innerHTML=`<section class="panel"><div class="row"><h2>Semua Brewing (${bs.length})</h2><input class="search" id="search" placeholder="Cari bean, dripper, notes..." style="max-width:350px"></div><div id="brewList"></div></section>`;let paint=()=>{$('#brewList').innerHTML=bs.filter(b=>[b.bean,b.dripper,b.grinder,b.title,b.notes,b.date].join(' ').toLowerCase().includes($('#search').value.toLowerCase())).map(brewLine).join('')||'<div class="empty">Tidak ada hasil.</div>';bindActions()};$('#search').oninput=paint;paint()}
function bindActions(){document.querySelectorAll('[data-action]').forEach(x=>x.onclick=async()=>{let b=(await all('brews')).find(b=>b.id===x.dataset.id);if(!b)return;if(x.dataset.action==='view')showDetail(b);if(x.dataset.action==='duplicate'){editing={...b,id:uid(),title:(b.title||'Brew')+' (copy)',date:today(),createdAt:new Date().toISOString()};navigate('new')}})}
function showDetail(b){$('#pageTitle').textContent='Brewing Detail';$('#content').innerHTML=`<div class="row"><div><div class="eyebrow">${esc(b.date)}</div><h2 style="font-size:25px">${esc(b.bean)} — ${esc(b.title)}</h2></div><div class="toolbar"><button class="btn" id="back">← History</button><button class="btn" id="edit">Edit</button><button class="btn danger" id="delete">Hapus</button></div></div><section class="panel"><h2>Brewing Parameters</h2><div class="detailgrid">${[['Server',b.server],['Dripper',b.dripper],['Paper Filter',b.filter],['Grinder',b.grinder],['Kettle',b.kettle],['Grind',b.grind],['Dose',b.dose+' g'],['Water',b.water+' g'],['Ice',b.ice+' g'],['Temperature',b.temp+'°C'],['Time',b.time],['Ratio',b.dose?'1 : '+fmt(b.water/b.dose):'—'],['Method',b.method]].map(([k,v])=>`<div><small class="muted">${esc(k)}</small><b>${esc(v)}</b></div>`).join('')}</div></section><section class="panel"><h2>Pouring</h2>${(b.pours||[]).map((p,i)=>`<div class="brew">Pour ${i+1} <strong>${esc(p.at)} · ${esc(p.grams)}g cumulative</strong></div>`).join('')||'<p class="muted">Tidak dicatat</p>'}</section><section class="panel"><h2>Evaluation</h2><div class="detailgrid">${['sweetness','acidity','bitterness','body','aroma','overall'].map(k=>`<div><small class="muted">${esc(k)}</small><b>${esc(b[k]||'—')} / 5</b></div>`).join('')}</div><h2 style="margin-top:22px">Tasting Notes</h2><p style="white-space:pre-wrap">${esc(b.notes||'Belum ada catatan')}</p></section>`;$('#back').onclick=()=>navigate('history');$('#edit').onclick=()=>{editing=b;navigate('new')};$('#delete').onclick=async()=>{if(confirm('Hapus brewing ini secara permanen?')){await del('brews',b.id);toast('Brewing dihapus');navigate('history')}}}
async function renderBeans(){let beans=(await all('beans')).sort((a,b)=>a.name.localeCompare(b.name));$('#content').innerHTML=`<section class="panel"><h2>Add Coffee Bean</h2><form id="beanForm"><div class="formgrid">${field('Bean Name','name','','text','required')}${field('Roaster','roaster')}${field('Origin','origin')}${field('Process','process')}${field('Roast Level','roast')}</div><button class="btn primary" style="margin-top:16px">＋ Add Bean</button></form></section><section class="panel"><h2>Bean Library (${beans.length})</h2>${beans.map(b=>`<div class="brew"><div><strong>${esc(b.name)}</strong><small>${esc([b.roaster,b.origin,b.process,b.roast].filter(Boolean).join(' · '))}</small></div><button class="btn danger" data-bean-delete="${esc(b.id)}">Hapus</button></div>`).join('')}</section>`;$('#beanForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);await put('beans',{id:uid(),...Object.fromEntries(f)});toast('Bean ditambahkan');renderBeans()};document.querySelectorAll('[data-bean-delete]').forEach(x=>x.onclick=async()=>{if(confirm('Hapus bean dari library? Riwayat brewing tetap ada.')){await del('beans',x.dataset.beanDelete);renderBeans()}})}

const equipmentCategories={server:'Coffee Server',dripper:'Dripper',filter:'Paper Filter',grinder:'Grinder',kettle:'Kettle'};
function equipmentSelect(label,category,items,current=''){let choices=[...new Set([current,...items.filter(x=>x.category===category).map(x=>x.name)].filter(Boolean))];return `<div class="field"><label for="f-${category}">${label}</label><select id="f-${category}" name="${category}"><option value="">— Pilih ${label} —</option>${choices.map(n=>`<option value="${esc(n)}" ${n===current?'selected':''}>${esc(n)}</option>`).join('')}</select></div>`}
async function renderEquipment(){let items=await all('equipment');$('#content').innerHTML=`<section class="panel"><h2>Tambah Perlengkapan</h2><p class="muted">Master equipment digunakan sebagai pilihan di New Brew. Grinder dan kettle dapat ditandai manual atau electric.</p><form id="equipmentForm"><div class="formgrid">${selectField('Kategori','category',Object.keys(equipmentCategories),'dripper')}${field('Nama Perlengkapan','name','','text','required')}${field('Brand','brand')}${field('Model','model')}${selectField('Tipe','type',['','Manual','Electric','Manual / stovetop','Cone','Flat-bottom','Hybrid','Paper','Metal','Cloth'],'')}${field('Kapasitas (ml)','capacity','','number','min="0"')}${field('Catatan','notes')}${selectField('Grind unit (grinder)','grindUnit',['','numeric','clicks','stepless'],'')}${field('Grind minimum','grindMin')}${field('Grind maximum','grindMax')}${field('Grind step','grindStep')}${field('Compatible drippers (paper filter, pisahkan koma)','compatibleDrippers')}</div><button class="btn primary" style="margin-top:16px">＋ Simpan Equipment</button></form></section><section class="panel"><h2>Equipment Library (${items.length})</h2>${Object.entries(equipmentCategories).map(([key,label])=>`<h3>${label}</h3>${items.filter(x=>x.category===key).map(x=>`<div class="brew"><div><strong>${esc(x.name)}</strong><small>${esc([x.brand,x.model,x.type,x.capacity?x.capacity+' ml':'',x.notes].filter(Boolean).join(' · '))}</small></div><div class="list-actions"><button class="btn" data-eq-edit="${esc(x.id)}">Edit</button><button class="btn danger" data-eq-delete="${esc(x.id)}">Hapus</button></div></div>`).join('')||'<p class="muted">Belum ada.</p>'}`).join('')}</section>`;let currentId=null;const form=$('#equipmentForm');form.onsubmit=async e=>{e.preventDefault();let f=Object.fromEntries(new FormData(form));if(!f.name.trim())return;await put('equipment',{id:currentId||uid(),...f});toast('Equipment tersimpan');renderEquipment()};document.querySelectorAll('[data-eq-edit]').forEach(btn=>btn.onclick=()=>{let x=items.find(y=>y.id===btn.dataset.eqEdit);if(!x)return;currentId=x.id;for(let k of ['category','name','brand','model','type','capacity','notes','grindUnit','grindMin','grindMax','grindStep','compatibleDrippers'])if(form.elements[k])form.elements[k].value=x[k]||'';form.scrollIntoView({behavior:'smooth'})});document.querySelectorAll('[data-eq-delete]').forEach(btn=>btn.onclick=async()=>{if(confirm('Hapus dari library? Riwayat brewing tetap tersimpan.')){await del('equipment',btn.dataset.eqDelete);renderEquipment()}})}
async function renderRecipes(){let recipes=(await all('recipes')).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));$('#content').innerHTML=`<section class="panel"><h2>Recipe Library (${recipes.length})</h2><p class="muted">Simpan resep terpisah dari History. Edit metode pouring dan equipment tanpa menghubungkan Bluetooth scale.</p><button class="btn primary" id="newRecipe">＋ Create from New Brew</button>${recipes.map(r=>`<div class="brew"><div><strong>${esc(r.title)}</strong><small>${esc(r.bean||'')} · ${esc(r.dripper||'')} · ${esc(r.dose||'')} g · ${esc((r.pours||[]).length)} pours</small></div><div class="list-actions"><button class="btn" data-use-recipe="${esc(r.id)}">Use / Edit</button><button class="btn danger" data-delete-recipe="${esc(r.id)}">Hapus</button></div></div>`).join('')||'<p class="muted">Belum ada resep. Buat melalui New Brew → Save as Recipe.</p>'}</section>`;$('#newRecipe').onclick=()=>{editing=null;navigate('new')};document.querySelectorAll('[data-use-recipe]').forEach(btn=>btn.onclick=()=>{let r=recipes.find(x=>x.id===btn.dataset.useRecipe);if(!r)return;editing={...r,id:undefined,createdAt:undefined,_recipeId:r.id,_recipeCreatedAt:r.createdAt};navigate('new')});document.querySelectorAll('[data-delete-recipe]').forEach(btn=>btn.onclick=async()=>{if(confirm('Hapus resep ini? History tidak terpengaruh.')){await del('recipes',btn.dataset.deleteRecipe);renderRecipes()}})}
async function renderCompare(){let bs=(await all('brews')).sort((a,b)=>b.date.localeCompare(a.date));if(bs.length<2){$('#content').innerHTML='<div class="panel empty">Perlu minimal dua brewing untuk dibandingkan.</div>';return}let options=bs.map(b=>`<option value="${esc(b.id)}">${esc(b.date+' · '+b.bean+' · '+b.title)}</option>`).join('');$('#content').innerHTML=`<section class="panel"><h2>Select Two Brews</h2><div class="formgrid" style="grid-template-columns:1fr 1fr"><div class="field"><label>Brew A</label><select id="compareA">${options}</select></div><div class="field"><label>Brew B</label><select id="compareB">${options}</select></div></div></section><div class="compare" id="comparison" style="margin-top:16px"></div>`;$('#compareB').selectedIndex=1;function paint(){let a=bs.find(x=>x.id===$('#compareA').value),b=bs.find(x=>x.id===$('#compareB').value);$('#comparison').innerHTML=[a,b].map(x=>`<section class="panel"><h2>${esc(x.bean)}</h2><div class="muted">${esc(x.title)} · ${esc(x.date)}</div>${[['Server',x.server],['Dripper',x.dripper],['Filter',x.filter],['Grinder',x.grinder],['Kettle',x.kettle],['Grind',x.grind],['Dose',x.dose+'g'],['Water',x.water+'g'],['Ice',x.ice+'g'],['Temp',x.temp+'°C'],['Time',x.time],...['sweetness','acidity','bitterness','body','aroma','overall'].map(k=>[k,x[k]+'/5'])].map(([k,v])=>`<div class="brew"><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join('')}<p style="white-space:pre-wrap">${esc(x.notes)}</p></section>`).join('')}$('#compareA').onchange=paint;$('#compareB').onchange=paint;paint()}
function download(filename,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function csvCell(s){return '"'+String(s??'').replace(/"/g,'""')+'"'}async function exportJSON(){download('my-brew-lab-backup-'+today()+'.json',JSON.stringify({app:'My Brew Lab',version:1,exportedAt:new Date().toISOString(),beans:await all('beans'),equipment:await all('equipment'),recipes:await all('recipes'),brews:await all('brews')},null,2),'application/json');toast('Backup JSON dibuat')}async function exportCSV(){let bs=await all('brews'),cols=['date','title','bean','server','dripper','filter','grinder','kettle','grind','dose','water','ice','temp','time','method','sweetness','acidity','bitterness','body','aroma','aftertaste','overall','notes','pours'];let rows=[cols.map(csvCell).join(','),...bs.map(b=>cols.map(k=>csvCell(k==='pours'?JSON.stringify(b.pours||[]):b[k])).join(','))];download('my-brew-lab-history-'+today()+'.csv','\ufeff'+rows.join('\r\n'),'text/csv;charset=utf-8');toast('CSV berhasil dibuat')}
function renderBackup(){$('#content').innerHTML=`<section class="panel"><h2>Backup & Export</h2><p class="muted">JSON menyimpan seluruh data dan dapat dipulihkan kembali. CSV untuk dibuka di Excel/Google Sheets.</p><div class="toolbar"><button class="btn primary" id="json">↓ Export JSON</button><button class="btn" id="csv">↓ Export CSV</button><button class="btn" id="import">↑ Import JSON</button></div></section><section class="panel"><h2>Perlindungan Data</h2><p class="muted">Database tersimpan di browser/perangkat, bukan cloud. Safari private browsing, pembersihan website data, atau mengganti perangkat dapat menyebabkan data hilang. Simpan file backup JSON di iCloud Drive secara berkala.</p><p class="muted">Import JSON akan <b>menggabungkan berdasarkan ID</b>: data dengan ID sama akan diperbarui, data lainnya ditambahkan.</p></section><section class="panel"><h2>Reset</h2><p class="muted">Hapus seluruh brewing dan bean lokal. Tidak dapat dibatalkan tanpa backup.</p><button class="btn danger" id="reset">Hapus Semua Data</button></section>`;$('#json').onclick=exportJSON;$('#csv').onclick=exportCSV;$('#import').onclick=()=>$('#importFile').click();$('#reset').onclick=async()=>{if(confirm('PERINGATAN: Hapus semua data lokal? Pastikan sudah backup.')&&confirm('Konfirmasi kedua: benar-benar hapus semuanya?')){await clear('brews');await clear('beans');await clear('equipment');await clear('recipes');toast('Semua data dihapus');navigate('dashboard')}}}
$('#importFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(data.app!=='My Brew Lab'||!Array.isArray(data.brews)||!Array.isArray(data.beans))throw Error('Format backup tidak sesuai');if(!confirm(`Import ${data.brews.length} brews dan ${data.beans.length} beans? Data ID sama akan diperbarui.`))return;for(let b of data.beans){if(b.id&&b.name)await put('beans',b)}for(let x of (Array.isArray(data.equipment)?data.equipment:[])){if(x.id&&x.category&&x.name)await put('equipment',x)}for(let r of (Array.isArray(data.recipes)?data.recipes:[])){if(r.id&&r.title)await put('recipes',r)}for(let b of data.brews){if(b.id&&b.bean)await put('brews',b)}toast('Import berhasil');navigate('dashboard')}catch(err){alert('Import gagal: '+err.message)}finally{e.target.value=''}};
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});init().catch(err=>{$('#content').innerHTML='<div class="panel">Gagal membuka database. Pastikan Safari tidak berada di Private Browsing dan penyimpanan diizinkan. '+esc(err.message)+'</div>'});
</script></body></html>
